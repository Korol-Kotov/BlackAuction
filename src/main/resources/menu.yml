main-menu:
  title: '&6&lЧерный Аукцион'
  size: 54

  items:
    filler:
      enabled: true
      material: "BLACK_STAINED_GLASS_PANE"
      display-name: " "
    inactive-lot:
      material: "GRAY_STAINED_GLASS_PANE"
      display-name: "&7&lНеактивный лот"
    lot:
      slots: [10, 13, 16, 28, 31, 34]
      lore:
        - '─────────────'
        - '💰 Текущая ставка: %start_price% ₽'
        - '👤 Лидер: %leader%'
        - '⏱️ До конца: %time%'
        - '─────────────'
        - '▶ Нажмите, чтобы сделать ставку'
    claims:
      slots: [43]
      material: "CHEST"
      display-name: "&e&lМои предметы"
      lore:
        - "&7Получите выигранные"
        - "&7предметы из буфера"
      menu: "claims-menu"
    history:
      slots: [45]
      material: "BOOK"
      display-name: "&e&lМоя история"
      lore:
        - "&7Просмотр всех"
        - "&7выигранных аукционов"
      menu: "my-history-menu"
    close:
      slots: [53]
      material: "BARRIER"
      display-name: "&c&lЗакрыть"

lot-menu:
  title: '&6&lАукцион: %item_name%'
  size: 27

  items:
    lot:
      slots: [12]
    info:
      slots: [10]
      material: "PAPER"
      display-name: '&e&lИнформация'
      lore:
        - "&7Текущая ставка: &f%current_bid%"
        - "&7Старт. цена: &f%start_price%"
        - "&7Мин. шаг: &f%min_step%"
        - "&7Лидер: &f%leader%"
        - "&7До конца: &f%time_left%"
    bid-min:
      slots: [14]
      material: "GOLD_NUGGET"
      display-name: "&e+%min_step%"
      lore:
        - "&7Поднять ставку на"
        - "&7минимальный шаг"
    bid-custom:
      slots: [16]
      material: "GOLD_INGOT"
      display-name: "&6&lРучная ставка"
      lore:
        - "&7Введите свою сумму"
        - "&7в чате"
    quick-bid:
      slots: [19, 20, 21, 22]
      bids: [100, 500, 1000, 5000]
      material: "GOLD_BLOCK"
      display-name: "&6&l+%bid%"
      lore:
        - "&7Поднять ставку на"
        - "&7%bid%"
    back:
      slots: [25]
      material: "ARROW"
      display-name: "&c&lНазад"
      menu: 'main-menu'

claims-menu:
  title: "&6&lМои предметы"
  size: 54

  items:
    claim:
      slots: "0..44"
      lore:
        - '─────────────'
        - '📅 Дата: %date%'
        - '💰 Цена: %final_price% ₽'
        - '📦 Статус: Ожидает получения'
        - '─────────────'
        - '▶ Нажмите, чтобы забрать'
    previous-page:
      slots: [50]
      material: "ARROW"
      display-name: "&aПредыдущая страница"
    next-page:
      slots: [51]
      material: "ARROW"
      display-name: "&aСледующая страница"
    claim-all:
      slots: [52]
      material: "EMERALD"
      display-name: "&a&lЗабрать всё"
      lore:
        - "&7Попытаться забрать"
        - "&7все предметы сразу"
    back:
      slots: [53]
      material: "ARROW"
      display-name: "&c&lНазад"
      menu: 'main-menu'

my-history-menu:
  title: "&6&lМоя история"
  size: 54

  items:
    item:
      slots: "0..44"
      lore:
        - '─────────────'
        - '📅 %date%'
        - '💰 Цена: %final_price% ₽'
        - '✅ Статус: %status%'
    previous-page:
      slots: [51]
      material: "ARROW"
      display-name: "&aПредыдущая страница"
    next-page:
      slots: [52]
      material: "ARROW"
      display-name: "&aСледующая страница"
    back:
      slots: [53]
      material: "BARRIER"
      display-name: "&c&lНазад"
      menu: 'main-menu'

admin-menu:
  title: "&c&lАдмин панель"
  size: 45

  items:
    inactive-lot:
      material: "GRAY_STAINED_GLASS_PANE"
      display-name: "&7&lНеактивный лот"
    lot:
      slots: [ 10, 13, 16, 28, 31, 34 ]
      lore:
        - '─────────────'
        - '💰 Начальная ставка: %start_price% ₽'
        - '👤 Создатель: %creator%'
        - '⏱️ Начало: %start_date%'
        - '⏱️ Конец: %end_date%'
        - '─────────────'
        - 'Нажмите, чтобы настроить'
    create:
      slots: [37]
      material: "CHEST"
      display-name: "Создать новый лот"
    history:
      slots: [39]
      material: "BOOK"
      display-name: "История всех лотов"
      menu: "admin-history-menu"
    close:
      slots: [44]
      material: "BARRIER"
      display-name: "Закрыть"

admin-lot-menu:
  title: "Настройка лота"
  size: 27

  items:
    lot-put:
      slots: [4]
      material: "GRAY_STAINED_GLASS_PANE"
      display-name: "Информация"
      lore:
        - "Чтобы выбрать предмет, нажмите на него у себя"
        - "в инвентаре."
        - "При настройке других вещей, ваш инвентарь"
        - "будет закрываться и вам необходимо будет"
        - "написать что-либо в чат."
    lot-item:
      slots: [13]
    start-price:
      slots: [18]
      material: "GOLD_INGOT"
      display-name: "Настроить стартовую цену"
    min-bet-step:
      slots: [19]
      material: "GOLD_NUGGET"
      display-name: "Настроить минимальный шаг"
    start-time:
      slots: [20]
      material: "COMPASS"
      display-name: "Настроить время и дату начала"
    end-time:
      slots: [21]
      material: "SAND"
      display-name: "Настроить время и дату конца"
    back:
      slots: [26]
      material: "ARROW"
      display-name: "Назад"
      menu: "admin-menu"

admin-history-menu:
  title: "История лотов"
  size: 54

  items:
    item:
      slots: "0..44"
      lore:
        - '─────────────'
        - '👤 Победитель: %player%'
        - '💰 Цена: %final_price% ₽'
        - '💸 Комиссия: %commission% ₽'
        - '📅 %date%'
        - '─────────────'
        - '▶ Нажмите для деталей'
    filter-player:
      slots: [49]
      material: "PLAYER_HEAD"
      display-name: "Отфильтровать по игроку"
      lore:
        - 'Нажмите и введите в чат ник игрока.'
    previous-page:
      slots: [50]
      material: "ARROW"
      display-name: "&aПредыдущая страница"
    next-page:
      slots: [51]
      material: "ARROW"
      display-name: "&aСледующая страница"
    back:
      slots: [53]
      material: "ARROW"
      display-name: "Назад"
      menu: "admin-menu"